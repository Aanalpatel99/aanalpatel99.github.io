<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
  {% seo %}
</head>
<body>
  <header class="site-nav">
    <div class="container site-nav-inner">
      <a href="/" class="site-nav-brand mono">aanal<span class="accent">.</span>patel</a>
      <nav class="site-nav-links mono">
        <a href="/#skills">Skills</a>
        <a href="/#projects">Work</a>
        <a href="/#canbus">CAN Bus</a>
        <a href="/#blog">Blog</a>
        <a href="/#resume">Resume</a>
        <a href="/#beyond">Beyond</a>
        <a href="/#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container site-footer-inner">
      <p class="mono">&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}</p>
      <div class="site-footer-links">
        <a href="mailto:{{ site.author.email }}">Email</a>
        <a href="{{ site.linkedin_url }}" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </footer>

  {% if site.goatcounter_code %}
  <script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  {% endif %}
</body>
</html>
